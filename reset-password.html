<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - New password</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="common.js"></script>
</head>
<body class="auth-page">

    <main class="auth-card">
        <h1 class="logo">MoneyTrack</h1>
        <p class="auth-message" id="authMessage"></p>

        <form id="newPasswordForm" class="auth-form">
            <h2>Choose a new password</h2>
            <label>New password (at least 8 characters)
                <input type="password" id="password" minlength="8" required autocomplete="new-password">
            </label>
            <label>Confirm new password
                <input type="password" id="password2" minlength="8" required autocomplete="new-password">
            </label>
            <button type="submit" class="btn">Save password</button>

            <div class="auth-links">
                <a href="index.html">Back to log in</a>
            </div>
        </form>
    </main>

    <script src="auth.js"></script>
</body>
</html>
