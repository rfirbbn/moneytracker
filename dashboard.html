<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - Finance Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="common.js"></script>
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <h2 class="logo">MoneyTrack</h2>

            <nav>
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="transactions.html">Transactions</a>
                <a href="budgets.html">Budgets</a>
                <a href="savings.html">Savings</a>
                <a href="settings.html">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Dashboard</h1>
                <p>Welcome back! Here's your financial overview.</p>
            </header>

            <div class="page-tools">
                <label for="monthFilter">Period</label>
                <select id="monthFilter"></select>
            </div>

            <section class="cards">
                <div class="card">
                    <p>Balance</p>
                    <h2 id="balance">Rp 0</h2>
                    <small id="balanceAll"></small>
                </div>

                <div class="card">
                    <p>Income</p>
                    <h2 id="income">Rp 0</h2>
                </div>

                <div class="card">
                    <p>Expenses</p>
                    <h2 id="expense">Rp 0</h2>
                </div>
            </section>

            <section class="transaction-form">
                <h2>Add Transaction</h2>

                <form id="TransactionForm">
                    <input type="text" id="description" placeholder="Transaction name" required>
                    <input type="number" id="amount" placeholder="Amount (Rp)" min="1" required>

                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <select id="category"></select>
                    <input type="date" id="date" required>

                    <button type="submit" class="btn">Add Transaction</button>
                </form>
            </section>

            <section class="charts">
                <div class="chart-box">
                    <h2>Expenses by category</h2>
                    <div class="chart-wrap">
                        <canvas id="categoryChart"></canvas>
                        <p class="chart-empty" id="categoryEmpty"></p>
                    </div>
                </div>

                <div class="chart-box">
                    <h2>Income vs expenses (last 6 months)</h2>
                    <div class="chart-wrap">
                        <canvas id="monthlyChart"></canvas>
                        <p class="chart-empty" id="monthlyEmpty"></p>
                    </div>
                </div>
            </section>

            <section class="transactions">
                <div class="section-head">
                    <h2>Recent Transactions</h2>
                    <a href="transactions.html">View all →</a>
                </div>

                <div id="transactionList">
                    <p>No transaction yet.</p>
                </div>
            </section>

        </main>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
