<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - Transactions</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="common.js"></script>
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <h2 class="logo">MoneyTrack</h2>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="transactions.html" class="active">Transactions</a>
                <a href="budgets.html">Budgets</a>
                <a href="savings.html">Savings</a>
                <a href="settings.html">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Transactions</h1>
                <p>Your full transaction history.</p>
            </header>

            <section class="cards">
                <div class="card">
                    <p>Balance (shown)</p>
                    <h2 id="balance">Rp 0</h2>
                </div>
                <div class="card">
                    <p>Income (shown)</p>
                    <h2 id="income">Rp 0</h2>
                </div>
                <div class="card">
                    <p>Expenses (shown)</p>
                    <h2 id="expense">Rp 0</h2>
                </div>
            </section>

            <section class="transaction-form">
                <h2>Filter</h2>

                <form id="filterForm">
                    <input type="text" id="search" placeholder="Search transaction name">

                    <select id="monthFilter" title="Period"></select>

                    <select id="filterType" title="Type">
                        <option value="all">All types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <select id="filterCategory" title="Category"></select>

                    <select id="sortOrder" title="Sort">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="highest">Highest amount</option>
                        <option value="lowest">Lowest amount</option>
                    </select>
                </form>
            </section>

            <section class="transactions">
                <div class="section-head">
                    <h2>History</h2>
                    <span id="resultCount"></span>
                </div>

                <div id="transactionList">
                    <p>No transaction yet.</p>
                </div>
            </section>

        </main>

    </div>

    <!-- EDIT DIALOG -->
    <dialog id="editDialog">
        <h2>Edit Transaction</h2>
        <form id="editForm" class="dialog-form">
            <input type="text" id="editName" placeholder="Transaction name" required>
            <input type="number" id="editAmount" placeholder="Amount (Rp)" min="1" required>
            <select id="editType">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <select id="editCategory"></select>
            <input type="date" id="editDate" required>

            <div class="dialog-actions">
                <button type="button" class="btn secondary" id="editCancel">Cancel</button>
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
    </dialog>

    <script src="transactions.js"></script>

</body>
</html>
