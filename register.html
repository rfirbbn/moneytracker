<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - Create account</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="common.js"></script>
</head>
<body class="auth-page" data-redirect-if-logged-in="true">

    <main class="auth-card">
        <h1 class="logo">MoneyTrack</h1>
        <p class="auth-message" id="authMessage"></p>

        <form id="registerForm" class="auth-form">
            <h2>Create account</h2>
            <label>Email
                <input type="email" id="email" required autocomplete="email">
            </label>
            <label>Password (at least 8 characters)
                <input type="password" id="password" minlength="8" required autocomplete="new-password">
            </label>
            <label>Confirm password
                <input type="password" id="password2" minlength="8" required autocomplete="new-password">
            </label>
            <button type="submit" class="btn">Create account</button>

            <div class="auth-links">
                <span>Already have an account?</span>
                <a href="index.html">Log in</a>
            </div>
        </form>
    </main>

    <script src="auth.js"></script>
</body>
</html>
